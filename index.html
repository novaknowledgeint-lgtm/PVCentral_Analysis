    const plotDiv = document.getElementById('clim_plot');
    const ageSlider = document.getElementById('ageSlider');
    const rateSlider = document.getElementById('rateSlider');
    const yearSelect = document.getElementById('yearSelect');
    const ageVal = document.getElementById('ageVal');
    const rateVal = document.getElementById('rateVal');

    function updateClimPlot() {
      const y = parseInt(ageSlider.value, 10);
      const rPct = parseFloat(rateSlider.value);
      const r = rPct / 100.0;
      const yrSel = yearSelect.value;

      ageVal.textContent = y;
      rateVal.textContent = rPct.toFixed(2);

      const factor = Math.pow(1.0 - r, y);
      const newMean = DATA.mean_ac.map(v => v * factor);
      const newMin = DATA.model_min.map(v => v * factor);
      const newMax = DATA.model_max.map(v => v * factor);

      const inX = [], inY = [], inTxt = [];
      const outX = [], outY = [], outTxt = [];
      const bgX = [], bgY = [], bgTxt = [];

      for (let i = 0; i < DATA.real_y.length; i++) {
        const mStr = DATA.real_x[i];
        const mIdx = DATA.months.indexOf(mStr);
        const val = DATA.real_y[i];
        const yr = DATA.real_yr[i];
        const txt = DATA.real_txt[i];

        if (yrSel === "ALL" || yr === parseInt(yrSel, 10)) {
          if (val >= newMin[mIdx] && val <= newMax[mIdx]) {
            inX.push(mStr); inY.push(val); inTxt.push(txt);
          } else {
            outX.push(mStr); outY.push(val); outTxt.push(txt);
          }
        } else {
          bgX.push(mStr); bgY.push(val); bgTxt.push(txt);
        }
      }

      const titleText = (yrSel === "ALL")
        ? "Comparaison Modèle vs Relevés Réels (Toutes les années)"
        : `Comparaison Modèle vs Relevés Réels — Année ${yrSel}`;

      Plotly.restyle(plotDiv, {
        y: [
          newMax.concat([...newMin].reverse()),
          newMean,
          bgY,
          inY,
          outY
        ],
        x: [
          DATA.months.concat([...DATA.months].reverse()),
          DATA.months,
          bgX,
          inX,
          outX
        ],
        text: [[], [], bgTxt, inTxt, outTxt],
        name: [
          `Modèle Vieilli Min–Max (${y} ans)`,
          `Modèle Vieilli Moyen (${y} ans, ${rPct.toFixed(2)}%/an)`,
          "Autres années (contexte)",
          "Réel (dans bande)",
          "Réel (hors bande)"
        ]
      }, [2, 3, 4, 5, 6]);

      Plotly.relayout(plotDiv, { title: titleText });
    }

    ageSlider.addEventListener('input', updateClimPlot);
    rateSlider.addEventListener('input', updateClimPlot);
    yearSelect.addEventListener('change', updateClimPlot);
